<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f8fa" />
  <meta name="color-scheme" content="light dark" />
  <!-- Title, description, canonical, social cards and structured data are written here at build time (scripts/postbuild.mjs). -->
  <!--seo-head-->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <noscript>
    <style>.reveal { opacity: 1 !important; transform: none !important; }</style>
  </noscript>
  <script>
    (function () {
      var theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      try {
        var stored = localStorage.getItem('portfolio-theme');
        if (stored) theme = JSON.parse(stored).state.theme;
      } catch (e) { /* storage blocked or unreadable: follow the system */ }
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#090c10');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
